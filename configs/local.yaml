# Local (Windows + Jupyter) overrides - use with:
#   python scripts/generate_data.py --config configs/local.yaml --large
#   python -m src.recognition.train --config configs/local.yaml

project:
  name: sinhala-document-ocr
  seed: 1337

paths:
  data_dir: data
  synthetic_dir: data/synthetic
  synthetic_pages_dir: data/synthetic_pages   # detector-in-the-loop training supplement (scripts/generate_pages.py)
  eval_pages_dir: data/eval_pages             # realistic held-out eval pages (scripts/build_eval_pages.py)
  uploads_dir: data/uploads
  real_dir: data/real
  debug_dir: data/debug
  raw_dir: data/raw
  preprocessed_dir: data/preprocessed
  models_dir: models
  charset_path: models/charset.json
  word_list: src/data/sample_words.txt
  corpus: src/data/corpus_sinhala.txt       # real-sentence corpus (scripts/build_corpus.py)
  form_vocab: src/data/form_vocab.txt

image:
  height: 48
  max_width: 512
  channels: 1
  pad_value: 255

synthetic:
  num_samples: 30000             # GPU baseline; use 5000 on CPU-only machines
  large:
    num_samples: 30000             # for --large / full GPU baseline (5000 CPU fallback)
    output_dir: data/synthetic
  split: [0.70, 0.15, 0.15]
  min_words: 1                   # words_per_line lower bound
  max_words: 12                  # words_per_line upper bound
  corpus_ratio: 0.65             # P(line sampled from the real-sentence corpus)
  numeric_ratio: 0.12
  mixed_ratio: 0.10
  font_sizes: [24, 28, 32, 36, 40, 48, 56, 64, 72]
  fonts:
    - "C:/Windows/Fonts/Nirmala.ttc"
    - "C:/Windows/Fonts/iskpota.ttf"
    - "fonts/NotoSansSinhala-Regular.ttf"
    - "fonts/NotoSerifSinhala-Regular.ttf"
    - "fonts/AbhayaLibre-Regular.ttf"
    - "fonts/Yaldevi-Variable.ttf"
  augment:
    rotation: true
    rotation_max_deg: 3.0
    perspective: true
    blur: true
    gaussian_noise: true
    brightness_contrast: true
    jpeg_compression: true
    shadow: true
    # v3 domain-gap augmentations (camera-photo realism, see src/data/synthetic_generator.py)
    defocus_blur: true      # box/motion blur instead of plain Gaussian (optics, not resampling)
    paper_texture: true     # correlated grain overlay (paper fibre / scan noise)
    moire: true             # rare low-amplitude interference pattern (screen re-photograph)
    edge_artifact: true     # rare rule-fragment / adjacent-line sliver at a crop edge
    multi_jpeg: true        # occasional second JPEG re-encode pass (multi-generation compression)

model:
  name: crnn
  cnn_out_channels: 512
  rnn_hidden: 256
  rnn_layers: 2
  dropout: 0.1

train:
  epochs: 40                      # GPU baseline (early stopping usually ends sooner)
  batch_size: 32
  lr: 0.001
  optimizer: adam
  weight_decay: 0.0
  num_workers: 0
  grad_clip: 5.0
  lr_scheduler: plateau    # plateau (ReduceLROnPlateau on val CER) | cosine | none
  lr_factor: 0.5
  lr_patience: 3
  min_lr: 0.000001
  early_stopping_patience: 8   # stop after N validations without val CER improvement
  val_every: 1
  save_best_metric: cer
  device: auto

detection:
  method: projection       # projection (robust: borders/watermarks/centered lines) | contours
  min_line_height: 8
  min_line_width: 20
  dilate_kernel: [25, 3]
  crop_padding_x: 10
  crop_padding_y: 5
  min_crop_height: 14
  min_contrast: 25         # projection: ignore ink fainter than this vs background (watermarks)
  suppress_borders: true   # projection: mask decorative frames / margin ornaments
  min_ink_frac: 0.004      # projection: row is text when >= this fraction of width is ink
  min_ink_density: 0.01    # projection: drop boxes with less ink than this
  min_height_frac: 0.35    # projection: drop boxes shorter than this x median line height
  deskew: true             # estimate page skew from the ink mask and rotate upright before detection
  deskew_max_angle: 5.0    # search range (degrees) for the skew estimate
  deskew_min_angle: 0.3    # ignore corrections smaller than this (page already upright)

postprocess:
  vocab_path: src/data/sample_words.txt
  max_edit_distance: 2

inference:
  auto_invert: true
  # CTC prefix beam search with character n-gram LM shallow fusion:
  #   score = log P_ctc(y|x) + lm_weight * log P_lm(y) + insertion_bonus * |y|
  # The LM (src/postprocess/char_lm.py) is built at load time from training-side
  # Sinhala text only - no held-out ground truth - and fixes the orthographic
  # confusions that dominate low-resolution lines (ේ/ී, ්/ි). At weight 0.2 it
  # improved or tied EVERY held-out set (real photos 0.0990 -> 0.0877,
  # eval_pages 0.0100 -> 0.0088, adversarial unchanged); weights above ~0.5
  # overfit the LM corpus and wreck out-of-domain text such as song lyrics.
  # Set decode: greedy for the fastest path (~35% quicker, slightly worse).
  decode: beam_lm
  lm_weight: 0.2
  insertion_bonus: 0.6
  beam_width: 12
  beam_top_k: 8
  lm_order: 6
  use_grayscale: true
  binarize: false
  denoise: false
  image_height: 48
  min_model_width: 32
  # Upscale short crops to the model height instead of white-padding them.
  # Training always resizes to image.height (dataset.resize_keep_height), so
  # padding tiny crops was a train/infer mismatch: an ~18px lyric line kept
  # its glyphs at 1/3 input height and decoded as garbage (jul28 diagnosis;
  # flipping this halved held-out real-photo CER with the same checkpoint).
  pad_to_height: false
